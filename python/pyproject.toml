[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dupescan"
version = "0.1.0"
description = "Near-duplicate document detection with MinHash and LSH, scored against known duplicate families."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dupescan contributors" }]
keywords = ["minhash", "lsh", "near-duplicate", "deduplication", "nlp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: TypeScript",
  "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.scripts]
dupescan = "dupescan.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/dupescan"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
